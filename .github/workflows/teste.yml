name: Teste automático do app
on:
  push:
    branches: [main]
    paths: ['principal.html', 'doomsday*.html', 'amigo/**', 'beta/**', 'v40/**', 'tools/**', 'index.html']
  workflow_dispatch:
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python tools/smoke_test.py
