name: App Android (APK)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gerar APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar arquivo (nome com a versão, ex.: ucm-watchlist-v40.6.apk)
        id: nome
        run: |
          V=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
          F="ucm-watchlist-v$V.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$F"
          echo "file=$F" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ucm-watchlist-apk
          path: ${{ steps.nome.outputs.file }}

      - name: Tirar os APKs antigos do release (fica só o da versão nova)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh api repos/${{ github.repository }}/releases/tags/apk-latest --jq .id || true)
          if [ -n "$ID" ]; then
            gh api repos/${{ github.repository }}/releases/$ID/assets --jq '.[] | select(.name != "${{ steps.nome.outputs.file }}") | .id' | while read A; do
              gh api -X DELETE repos/${{ github.repository }}/releases/assets/$A || true
            done
          fi

      - name: Publicar no release "apk-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: App Android (APK)
          make_latest: true
          overwrite_files: true
          files: ${{ steps.nome.outputs.file }}
          body: |
            App Android da UCM Watchlist (abre breno779.github.io dentro de um app próprio).
            Baixe o arquivo ${{ steps.nome.outputs.file }} abaixo no celular e instale (instala por cima, sem perder nada).
            Versão ${{ steps.nome.outputs.version }} · build ${{ github.run_number }}.
