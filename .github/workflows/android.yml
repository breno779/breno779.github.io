name: App Android (APK)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gerar APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar arquivo
        run: cp android/app/build/outputs/apk/release/app-release.apk ucm-watchlist.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ucm-watchlist-apk
          path: ucm-watchlist.apk

      - name: Publicar no release "apk-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: App Android (APK)
          make_latest: true
          overwrite_files: true
          files: ucm-watchlist.apk
          body: |
            App Android da UCM Watchlist (abre breno779.github.io dentro de um app próprio).
            Baixe o arquivo ucm-watchlist.apk abaixo no celular e instale.
            Versão gerada automaticamente (build ${{ github.run_number }}).
