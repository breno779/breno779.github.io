<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cronologia UCM — Watchlist</title>
<link rel="manifest" href="manifest.json">
<script>
// Registra o service worker pra deixar o app funcionar offline depois da primeira vez.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
<meta name="theme-color" content="#15141b">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UCM Watchlist">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #15141b;
    --paper: #efe4c8;
    --gold: #d9a441;
    --crimson: #b6332c;
    --muted: #9a927e;
    --line: rgba(255,255,255,0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--ink);
    overscroll-behavior: none;
  }
  @supports (height: 100dvh) {
    html, body { height: 100dvh; }
  }
  body {
    display: flex; flex-direction: column;
    font-family: 'Baloo 2', system-ui, sans-serif;
  }
  .shell-tabbar {
    display: flex; flex-shrink: 0;
    background: var(--ink);
    border-bottom: 2px solid var(--gold);
    padding-top: env(safe-area-inset-top, 0);
  }
  .shell-tab {
    flex: 1; border: none; background: transparent; color: var(--muted);
    font-family: inherit; font-weight: 800; font-size: 0.82rem;
    letter-spacing: 0.03em;
    padding: 14px 6px 12px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .shell-tab.active { color: var(--paper); border-bottom-color: var(--crimson); }
  .shell-frames { flex: 1; position: relative; min-height: 0; }
  iframe.shell-frame {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: none; display: none; background: var(--ink);
  }
  iframe.shell-frame.active { display: block; }
</style>
</head>
<body>
<div class="shell-tabbar">
  <button class="shell-tab" id="shellTabPrincipal" data-target="frmPrincipal">🕐 PRINCIPAL</button>
  <button class="shell-tab" id="shellTabDoomsday" data-target="frmDoomsday">🎬 DOOMSDAY</button>
</div>
<div class="shell-frames">
  <iframe class="shell-frame" id="frmPrincipal" data-src="principal.html" title="Lista principal"></iframe>
  <iframe class="shell-frame" id="frmDoomsday" data-src="doomsday.html" title="Lista Doomsday"></iframe>
</div>
<script>
  // App-mãe: junta as duas listas (principal e Doomsday) num só ícone/atalho na tela inicial,
  // mas cada uma continua 100% independente — são páginas separadas (principal.html e
  // doomsday.html) carregadas em iframes, cada uma com seu próprio progresso salvo.
  const SHELL_KEY = 'ucm-shell-active-tab';
  const tabs = Array.from(document.querySelectorAll('.shell-tab'));
  const frames = {
    frmPrincipal: document.getElementById('frmPrincipal'),
    frmDoomsday: document.getElementById('frmDoomsday'),
  };

  let shortcutAction = null;
  try { shortcutAction = new URLSearchParams(location.search).get('action'); } catch (e) {}
  if (shortcutAction === 'watchnow') {
    frames.frmPrincipal.dataset.src = 'principal.html?action=watchnow';
  }

  function activate(targetId) {
    tabs.forEach((t) => t.classList.toggle('active', t.dataset.target === targetId));
    Object.entries(frames).forEach(([id, frame]) => {
      const isTarget = id === targetId;
      frame.classList.toggle('active', isTarget);
      // só carrega a página de verdade na primeira vez que a aba é aberta (economiza
      // memória/dados — a lista Doomsday só entra em ação se a pessoa realmente abrir ela).
      if (isTarget && frame.dataset.src) {
        frame.src = frame.dataset.src;
        delete frame.dataset.src;
      }
    });
    try { localStorage.setItem(SHELL_KEY, targetId); } catch (e) {}
  }

  tabs.forEach((btn) => btn.addEventListener('click', () => activate(btn.dataset.target)));

  let initialTab = 'frmPrincipal';
  try {
    const saved = localStorage.getItem(SHELL_KEY);
    if (saved && frames[saved]) initialTab = saved;
  } catch (e) {}
  if (shortcutAction === 'watchnow') initialTab = 'frmPrincipal';
  activate(initialTab);

  // instalação na tela inicial: o evento beforeinstallprompt só dispara no documento de topo
  // (esse aqui, o app-mãe) — então guardamos ele aqui, e os botões "Adicionar à tela inicial"
  // de dentro de cada lista (iframe) chamam window.top.triggerAppInstall() pra usar esse mesmo
  // prompt. Assim o app inteiro (as 2 listas) é instalado de uma vez só, com 1 ícone.
  let shellDeferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    shellDeferredPrompt = e;
  });
  window.addEventListener('appinstalled', () => { shellDeferredPrompt = null; });
  window.triggerAppInstall = async function () {
    if (shellDeferredPrompt) {
      shellDeferredPrompt.prompt();
      await shellDeferredPrompt.userChoice;
      shellDeferredPrompt = null;
      return 'prompted';
    }
    alert('Seu navegador não ofereceu a instalação automática (comum em navegadores embutidos, tipo dentro de outros apps).\n\nAbra esse link direto no Chrome ou Safari:\n\n• Chrome (Android): toque nos 3 pontinhos no canto ▸ "Adicionar à tela inicial".\n• Safari (iPhone): toque no ícone de compartilhar (quadrado com seta) ▸ "Adicionar à Tela de Início".');
    return 'unavailable';
  };
</script>
</body>
</html>
